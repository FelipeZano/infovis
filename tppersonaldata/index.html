  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #333;
    }

    /* Barra superior */
    header {
      background: #000000;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
    }

    header h1 {
      font-size: 1.5rem;
    }

    header img {
      height: 40px;
    }

    /* Carrusel */
    .carousel-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 40px auto;
      overflow: hidden;
    }

    .carousel-slide {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-item {
      min-width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .carousel-item iframe,
    .carousel-item img,
    .carousel-item svg {
      max-width: 100%;
      max-height: 70vh;
    }

    /* Botones */
    .prev, .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 18px;
      border-radius: 50%;
    }

    .prev { left: 15px; }
    .next { right: 15px; }

    .prev:hover, .next:hover {
      background: rgba(0, 0, 0, 0.9);
    }
  </style>
</head>

  <script>
    let slideIndex = 0;
    const slideContainer = document.getElementById('carousel');
    const totalSlides = slideContainer.children.length;

    function moveSlide(direction) {
      slideIndex = (slideIndex + direction + totalSlides) % totalSlides;
      slideContainer.style.transform = `translateX(-${slideIndex * 100}%)`;
    }
