<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Presentación de Gráficos</title>
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #333;
    }

    /* Barra superior */
    header {
      background: #000000;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
    }

    header h1 {
      font-size: 1.5rem;
    }

    header img {
      height: 40px;
    }

    /* Carrusel */
    .carousel-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 40px auto;
      overflow: hidden;
    }

    .carousel-slide {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-item {
      min-width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .carousel-item iframe,
    .carousel-item img,
    .carousel-item svg {
      max-width: 100%;
      max-height: 70vh;
    }

    /* Botones */
    .prev, .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 18px;
      border-radius: 50%;
    }

    .prev { left: 15px; }
    .next { right: 15px; }

    .prev:hover, .next:hover {
      background: rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <!-- Barra superior -->
  <header>
    <h1>Presentación de Gráficos</h1>
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" alt="Spotify Logo">
  </header>

  <!-- Carrusel -->
  <div class="carousel-container">
    <div class="carousel-slide" id="carousel">

      <!-- Gráfico 1 (embed) -->
      <div class="carousel-item">
        <iframe src="URL_DEL_GRAFICO_1" frameborder="0"></iframe>
      </div>

      <!-- Gráfico 2 (embed) -->
      <div class="carousel-item">
        <iframe src="URL_DEL_GRAFICO_2" frameborder="0"></iframe>
      </div>

      <!-- Gráfico 3 (embed) -->
      <div class="carousel-item">
        <iframe src="URL_DEL_GRAFICO_3" frameborder="0"></iframe>
      </div>

      <!-- Gráfico 4 (SVG local) -->
      <div class="carousel-item">
        <img src="assets/grafico.svg" alt="Gráfico SVG">
      </div>

    </div>

    <!-- Botones -->
    <button class="prev" onclick="moveSlide(-1)">&#10094;</button>
    <button class="next" onclick="moveSlide(1)">&#10095;</button>
  </div>

  <script>
    let slideIndex = 0;
    const slideContainer = document.getElementById('carousel');
    const totalSlides = slideContainer.children.length;

    function moveSlide(direction) {
      slideIndex = (slideIndex + direction + totalSlides) % totalSlides;
      slideContainer.style.transform = `translateX(-${slideIndex * 100}%)`;
    }
  </script>
  <header>
    <h1>Desliza para ver mas gráficos</h1>
  </header>

</body>
</html>
