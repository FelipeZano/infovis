<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Datos de Musica - Felipe Zanel -</title>
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #333;
    }

    /* Barra superior */
    header {
      background: #000000;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
    }

    header h1 {
      font-size: 1.5rem;
    }

    header img {
      height: 40px;
    }

    /* Carrusel */
    .carousel-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 40px auto;
      overflow: hidden;
    }

    .carousel-slide {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-item {
      min-width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .carousel-item iframe,
    .carousel-item img,
    .carousel-item svg {
      max-width: 100%;
      max-height: 70vh;
    }

    /* Botones */
    .prev, .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 18px;
      border-radius: 50%;
    }

    .prev { left: 15px; }
    .next { right: 15px; }

    .prev:hover, .next:hover {
      background: rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <!-- Barra superior -->
  <header>
    <h1>Presentación de Gráficos</h1>
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" alt="Spotify Logo">
  </header>

  <!-- Carrusel -->
  <div class="carousel-container">
    <div class="carousel-slide" id="carousel">

      <!-- Gráfico 1 (embed) -->
      <div class="carousel-item">
        <iframe src="URL_DEL_GRAFICO_1" frameborder="0"></iframe>
      </div>

      <!-- Gráfico 2 (embed) -->
      <div class="carousel-item">
        <iframe src="URL_DEL_GRAFICO_2" frameborder="0"></iframe>
      </div>

      <!-- Gráfico 3 (embed) -->
      <div class="carousel-item">
        <iframe src="URL_DEL_GRAFICO_3" frameborder="0"></iframe>
      </div>

      <!-- Gráfico 4 (SVG local) -->
      <div class="carousel-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="805" height="600"><rect width="805" height="600" x="0" y="0" fill="#FFFFFF" id="background"/><g transform="translate(10,10)" id="viz"><g id="leaves"><g transform="translate(2,2)"><rect id="path0" fill="#f8e71c" width="470" height="200"/><clipPath id="clip0"><use NS1:href="#path0" xmlns:NS1="http://www.w3.org/1999/xlink"/></clipPath><text clip-path="url(#clip0)" font-family="Arial, sans-serif" font-size="10" dominant-baseline="text-before-edge" class="txt"><tspan x="3" y="0.2em" style="font-family: Arial, sans-serif; font-size: 10px; fill: black; font-weight: bold;">Light listeners</tspan><tspan x="3" y="1.3em" style="font-family: Arial, sans-serif; font-size: 10px; fill: black; font-weight: normal;">2650</tspan></text></g><g transform="translate(2,204)"><rect id="path1" fill="#d0021b" width="470" height="374"/><clipPath id="clip1"><use NS2:href="#path1" xmlns:NS2="http://www.w3.org/1999/xlink"/></clipPath><text clip-path="url(#clip1)" font-family="Arial, sans-serif" font-size="10" dominant-baseline="text-before-edge" class="txt"><tspan x="3" y="0.2em" style="font-family: Arial, sans-serif; font-size: 10px; fill: black; font-weight: bold;">Previously Active Listeners</tspan><tspan x="3" y="1.3em" style="font-family: Arial, sans-serif; font-size: 10px; fill: black; font-weight: normal;">4937</tspan></text></g><g transform="translate(474,2)"><rect id="path2" fill="#9b9b9b" width="159" height="477"/><clipPath id="clip2"><use NS3:href="#path2" xmlns:NS3="http://www.w3.org/1999/xlink"/></clipPath><text clip-path="url(#clip2)" font-family="Arial, sans-serif" font-size="10" dominant-baseline="text-before-edge" class="txt"><tspan x="3" y="0.2em" style="font-family: Arial, sans-serif; font-size: 10px; fill: black; font-weight: bold;"/><tspan x="3" y="1.3em" style="font-family: Arial, sans-serif; font-size: 10px; fill: black; font-weight: normal;">2145</tspan></text></g><g transform="translate(635,2)"><rect id="path3" fill="#4a90e2" width="148" height="477"/><clipPath id="clip3"><use NS4:href="#path3" xmlns:NS4="http://www.w3.org/1999/xlink"/></clipPath><text clip-path="url(#clip3)" font-family="Arial, sans-serif" font-size="10" dominant-baseline="text-before-edge" class="txt"><tspan x="3" y="0.2em" style="font-family: Arial, sans-serif; font-size: 10px; fill: black; font-weight: bold;">Moderate listeners</tspan><tspan x="3" y="1.3em" style="font-family: Arial, sans-serif; font-size: 10px; fill: black; font-weight: normal;">2006</tspan></text></g><g transform="translate(474,481)"><rect id="path4" fill="#7ed321" width="309" height="97"/><clipPath id="clip4"><use NS5:href="#path4" xmlns:NS5="http://www.w3.org/1999/xlink"/></clipPath><text clip-path="url(#clip4)" font-family="Arial, sans-serif" font-size="10" dominant-baseline="text-before-edge" class="txt"><tspan x="3" y="0.2em" style="font-family: Arial, sans-serif; font-size: 10px; fill: black; font-weight: bold;">Super Listeners</tspan><tspan x="3" y="1.3em" style="font-family: Arial, sans-serif; font-size: 10px; fill: black; font-weight: normal;">858</tspan></text></g></g></g></svg>
      </div>

    </div>

    <!-- Botones -->
    <button class="prev" onclick="moveSlide(-1)">&#10094;</button>
    <button class="next" onclick="moveSlide(1)">&#10095;</button>
  </div>

  <script>
    let slideIndex = 0;
    const slideContainer = document.getElementById('carousel');
    const totalSlides = slideContainer.children.length;

    function moveSlide(direction) {
      slideIndex = (slideIndex + direction + totalSlides) % totalSlides;
      slideContainer.style.transform = `translateX(-${slideIndex * 100}%)`;
    }
  </script>
</body>
</html>
